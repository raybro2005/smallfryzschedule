name: Twitch live watcher
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub often runs this late or skips; the hourly site refresh also starts it
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: twitch-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5   # the runner already has Node, so no setup step
      - name: Check Twitch (keeps checking every 3 minutes while he is live)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          WATCH_STATE: ${{ runner.temp }}/watch-state.json
        run: |
          git config user.name "twitch-watch"
          git config user.email "actions@users.noreply.github.com"
          deadline=$(( $(date +%s) + 330*60 ))
          while :; do
            git pull --rebase -q origin main
            node tools/twitch-watch.mjs
            IFS=$'\t' read -r live changed msg < <(node -e "const s=JSON.parse(require('fs').readFileSync(process.env.WATCH_STATE,'utf8'));console.log([s.live,s.changed,s.msg||''].join('\t'))")
            if [ "$changed" = "true" ]; then
              git add schedule.json
              git commit -q -m "Live status: $msg"
              for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
            fi
            [ "$live" = "true" ] || break
            [ $(date +%s) -lt $deadline ] || break
            sleep 180
          done
